name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Build site
        run: npm run build:astro
        env:
          # Lets the GitHub activity widget authenticate at build time and avoid rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pagefind index
        run: npx pagefind --site dist

      - name: Generate Content-Security-Policy
        run: node scripts/generate-csp.mjs

      - name: Verify build artifacts
        run: node scripts/check-build.mjs

      # The CSP allowlists inline scripts by hash, so a dependency bump that
      # changes Astro's hydration runtime, or a new third-party origin, breaks
      # the site silently. Exercise the real policy in a real browser.
      - name: Install Chromium for the CSP smoke test
        run: npx playwright install --with-deps chromium

      - name: CSP smoke test
        run: |
          node scripts/serve-csp.mjs 4399 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4399/ && break
            sleep 1
          done
          node scripts/check-csp.mjs

      - name: Lighthouse budget
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
